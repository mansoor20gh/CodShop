    <header>

        <span class="material-symbols-outlined"> menu </span>

    <div class="slideshow-container">
      <div class="mySlides fade">
        <img
          src="./po1.png"
          style="width: 100%"
          class="img-slideshow"
          draggable="false"
        />
      </div>

      <div class="mySlides fade">
        <img
          src="./po2.png"
          style="width: 100%"
          class="img-slideshow"
          draggable="false"
        />
      </div>
      <a class="prev" onclick="plusSlides(-1)"
        ><span class="material-symbols-outlined prev-icon">
          chevron_left
        </span></a
      >
      <a class="next" onclick="plusSlides(1)"
        ><span class="material-symbols-outlined next-icon">
          chevron_right
        </span></a
      >
      <div id="dot-container">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
      </div>
    </div>
