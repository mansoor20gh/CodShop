<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <button id="cart">
        <span class="material-symbols-outlined"> local_mall </span>
        <p class="count-product-cart">0</p>
      </button>
      <img
        src="./ChatGPT Image Aug 21, 2026, 10_15_40 AM.png"
        alt="logo site"
        id="logo_header"
        draggable="false"
      />
      <div class="container-menu">
        <button id="menu-btn">
          <span class="material-symbols-outlined"> menu </span>
        </button>
        <div class="menu">
          <a href="#">ارتباط با ما</a>
          <a href="#">سازنده</a>
        </div>
      </div>
    </header>
    <!--! slideshow gallery -->
    <div class="slideshow-container">
      <div class="mySlides fade">
        <img
          src="./po1.png"
          style="width: 100%"
          class="img-slideshow"
          draggable="false"
        />
      </div>

      <div class="mySlides fade">
        <img
          src="./po2.png"
          style="width: 100%"
          class="img-slideshow"
          draggable="false"
        />
      </div>
      <a class="prev"
        ><span class="material-symbols-outlined prev-icon">
          chevron_left
        </span></a
      >
      <a class="next"
        ><span class="material-symbols-outlined next-icon">
          chevron_right
        </span></a
      >
      <div id="dot-container">
        <span class="dot one"></span>
        <span class="dot two"></span>
      </div>
    </div>
    <input
      type="search"
      id="search-box"
      placeholder="جستجو کنید..."
      dir="rtl"
    />
    <!--! menu card carousel  -->
    <div id="card-carousel">
      <!--! cards in js import from DB  -->
    </div>
    <!--! footer -->
    <footer class="footer">
      <div class="description-container">
        <img
          src="./ChatGPT Image Aug 21, 2026, 10_15_40 AM.png"
          alt=""
          id="logo_header"
        />
        <address></address>
      </div>
      <div class="links-container">
        <a class="link contact" href="#">ارتباط با ما</a>
      </div>
      <span class="copy-container">
        <hr />
        <p id="copyright">© 2026 ajil dagh. All rights reserved.</p>
      </span>
    </footer>
    <!--! modal box  -->
    <div class="hide-bg"></div>
    <div class="modal-cart">
      <div class="container-card-shopping-cart">
        <div class="card-shopping-cart">
          <img
            id="img-card-shopping-cart"
            src="./ChatGPT Image Aug 21, 2026, 10_15_40 AM.png"
            alt=""
          />
          <div id="container-info-shopping-cart">
            <p id="title-product-shopping-cart">بادام</p>
            <p id="weight-product-shopping-cart">200g</p>
            <p id="price-shopping-cart">100,000</p>
          </div>
        </div>
        <div class="card-shopping-cart">
          <img
            id="img-card-shopping-cart"
            src="./ChatGPT Image Aug 21, 2026, 10_15_40 AM.png"
            alt=""
          />
          <div id="container-info-shopping-cart">
            <p id="title-product-shopping-cart">بادام</p>
            <p id="weight-product-shopping-cart">200g</p>
            <p id="price-shopping-cart">100,000</p>
          </div>
        </div>
        <div class="card-shopping-cart">
          <img
            id="img-card-shopping-cart"
            src="./ChatGPT Image Aug 21, 2026, 10_15_40 AM.png"
            alt=""
          />
          <div id="container-info-shopping-cart">
            <p id="title-product-shopping-cart">بادام</p>
            <p id="weight-product-shopping-cart">200g</p>
            <p id="price-shopping-cart">100,000</p>
          </div>
        </div>
        <div class="card-shopping-cart">
          <img
            id="img-card-shopping-cart"
            src="./ChatGPT Image Aug 21, 2026, 10_15_40 AM.png"
            alt=""
          />
          <div id="container-info-shopping-cart">
            <p id="title-product-shopping-cart">بادام</p>
            <p id="weight-product-shopping-cart">200g</p>
            <p id="price-shopping-cart">100,000</p>
          </div>
        </div>
      </div>
      <hr id="separator-card-shopping-cart" />
      <div class="container-total-shopping-cart">
        <p id="text-total-shopping-cart">جمع قیمت:</p>
        <p id="total-price">0</p>
      </div>
      <button id="final-btn-shopping-cart">ثبت نهایی</button>
    </div>
    <!--! information modal  -->
    <div class="personal-information">
      <p id="note-address">
        ارسال تنها به شهر های نجف اباد و فلاورجان است و در غیر این صورت سفارش
        شما ارسال نخواهد شد.
      </p>
      <hr id="space-information" />
      <form class="container-field-information">
        <div class="field-information">
          <label for="fname">نام</label>
          <input type="text" name="fname" class="input-information" />
        </div>
        <div class="field-information">
          <label for="lname">نام خانوادگی</label>
          <input type="text" name="lname" class="input-information" />
        </div>
        <div class="field-information">
          <label for="number">شماره تلفن</label>
          <input type="text" name="number" class="input-information" />
        </div>
        <div class="field-information">
          <label for="city">شهر</label>
          <input type="text" name="city" class="input-information" />
        </div>
        <div class="field-information">
          <label for="postal-code">کد پستی</label>
          <input type="text" name="postal-code" class="input-information" />
        </div>
        <div class="field-information">
          <label for="plate">پلاک</label>
          <input type="text" name="plate" class="input-information" />
        </div>
        <div class="field-information">
          <label for="address">ادرس</label>
          <textarea name="address" class="input-information"></textarea>
        </div>
      </form>
      <button id="send-information">ثبت اطلاعات</button>
    </div>
    <script src="./main.js" type="module"></script>
  </body>
</html>
